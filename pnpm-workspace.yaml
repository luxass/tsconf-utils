ignoreScripts: true
minimumReleaseAge: 7200
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
catalogMode: prefer

catalogs:
  dev:
    oxfmt: 0.79.0
    oxlint: 1.94.0
    publint: 0.3.25
    tsdown: 0.23.7
    typescript: 7.0.2

  runtime:
    effect: 4.1.4
    jsonc-parse: 2.0.0

  test:
    typescript-5: npm:typescript@5.9.3
    typescript-6: npm:typescript@6.0.3
    typescript-7.1: npm:typescript@7.1.0-beta
    vitest: 5.1.0

  types:
    "@types/node": 24.19.2
